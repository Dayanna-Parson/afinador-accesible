[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "motor_rust"
version = "0.1.0"
requires-python = ">=3.12"
description = "Extensión nativa de captura de audio y detección de tono (YIN) para AfinadorAccesible."

[tool.maturin]
module-name = "motor_rust"
features = ["pyo3/extension-module"]
